plugins { id 'com.android.application' }

android {
    namespace 'ru.aurora.filemanager'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.aurora.filemanager'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:0.2.21'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
