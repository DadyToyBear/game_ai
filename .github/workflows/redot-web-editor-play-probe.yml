name: Web editor Play and game capture probe

on:
  push:
    branches: [arena/b84b9c4f-game-ai]
    paths:
      - '.github/workflows/redot-web-editor-play-probe.yml'
      - 'redot-audit/web-editor-play.cjs'
      - 'redot-bridge/bridge.py'
      - 'redot-bridge/web/capture.js'
      - 'redot-bridge/web/redot-overlay.js'
      - 'redot-bridge/web/project-open.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  web-editor-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download a recent verified Web editor bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash redot-audit/download_latest_bundle.sh 'Assemble Redot Web Editor with Local Bridge' redot-web-editor-with-local-bridge web-editor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - name: Launch a test project from the real editor
        run: node redot-audit/web-editor-play.cjs web-editor
