name: Android MCP emulator integration

on:
  push:
    branches: [arena/b84b9c4f-game-ai]
    paths:
      - '.github/workflows/redot-android-mcp-integration.yml'
      - 'redot-audit/android-mcp-probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pillow>=10,<13'
      - name: Find current unexpired Android bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --limit 100 --json databaseId,workflowName,status,conclusion > runs.json
          found=false
          while read -r id; do
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "redot-26.3-rc2-android-latest-bridge" and .expired == false)] | length')
            if [ "$available" = 1 ] && gh run download "$id" --repo "$GITHUB_REPOSITORY" --name redot-26.3-rc2-android-latest-bridge --dir android-package; then
              echo "Using Android bundle from run $id"; found=true; break
            fi
          done < <(jq -r '.[] | select(.workflowName == "Assemble Android editor and latest bridge" and .status == "completed" and .conclusion == "success") | .databaseId' runs.json)
          if [ "$found" = false ]; then echo '::error::No unexpired Android bundle; run the Android bundle workflow first.'; exit 1; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe ARM64 editor on Google APIs x86 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: '-no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim'
          script: python redot-audit/android-mcp-probe.py android-package
