name: Native Redot Play Stop and Capture

on:
  push:
    branches: [arena/b84b9c4f-game-ai]
    paths:
      - '.github/workflows/redot-native-play-test.yml'
      - 'redot-audit/native_play_test.py'
      - 'redot-bridge/bridge.py'
      - 'redot-bridge/addons/redot_local_bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install virtual display and image decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          python -m pip install 'pillow>=10,<13'
      - name: Download and verify official Redot RC2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/redot-native
          gh release download redot-26.3-rc.2 --repo Redot-Engine/redot-engine --dir /tmp/redot-native \
            --pattern 'Redot_v26.3-rc.2_linux_x64.zip' --pattern 'SHA512-SUMS.txt'
          cd /tmp/redot-native
          grep '  releases/Redot_v26.3-rc.2_linux_x64.zip$' SHA512-SUMS.txt | sed 's|  releases/|  |' | sha512sum -c -
          unzip -q Redot_v26.3-rc.2_linux_x64.zip -d editor
      - name: Exercise MCP Play, game capture, Stop and delete
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t editors < <(find /tmp/redot-native/editor -maxdepth 2 -type f -executable)
          if [ "${#editors[@]}" -ne 1 ]; then echo '::error::Expected one executable editor' >&2; exit 1; fi
          if ! xvfb-run -a -s '-screen 0 1280x800x24' python redot-audit/native_play_test.py "${editors[0]}" > native.log 2>&1; then
            cat native.log
            python -c 'from pathlib import Path; s=Path("native.log").read_text(errors="replace")[-10000:]; print("::error title=Native Redot integration::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          cat native.log
