name: Build APK for download
on:
  push:
    branches: ['arena/f2de36b4-game-ai']
    paths: ['.github/workflows/android-apk-transfer.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK with Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          ./gradlew --no-daemon :app:assembleDebug
      - name: Make APK retrievable through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          path='app/build/outputs/apk/debug/app-debug.apk'
          with open(path,'rb') as f: data=f.read()
          body=json.dumps({'content':base64.b64encode(data).decode('ascii'),'encoding':'base64'}).encode()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req) as response: sha=json.load(response)['sha']
          print('::notice title=APK blob::'+sha)
          print('::notice title=APK SHA256::'+hashlib.sha256(data).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-files-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
