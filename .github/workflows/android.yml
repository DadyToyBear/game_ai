name: Release build (APK + AAB)

# Подписанные релизные файлы:
#   • APK — установить на телефон / раздать
#   • AAB — загрузить в Google Play Console
# Ключ подписи берётся из GitHub Secrets (инструкция: android/README-APK.md).
# Без секретов собирается неподписанный release — только для проверки сборки,
# в релиз такие файлы не публикуются.

on:
  push:
    branches: ['arena/a11b2c5a-game-ai']
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vendor/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Версия (например 1.0.2)'
        required: false
        default: ''
      versionCode:
        description: 'versionCode (целое, больше предыдущего)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Устанавливаемый APK на каждый пуш: всегда свежий файл в релизе apk-latest
  debug-apk:
    if: github.ref == 'refs/heads/arena/a11b2c5a-game-ai'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Android SDK
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d /tmp/cmdline
          sudo mv /tmp/cmdline/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
      - name: Собрать www/ и debug APK
        run: |
          bash scripts/build-www.sh
          npm install --no-audit --no-fund
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Опубликовать APK (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mini Studio — свежий APK (debug)
          prerelease: true
          body: |
            Автоматическая сборка из ветки `arena/a11b2c5a-game-ai`.
            Устанавливается сразу: скачайте APK ниже → «Установка из неизвестных источников» → открыть.
            Подписанные release-APK и AAB для Google Play — в релизе `release-latest`.
          files: android/app/build/outputs/apk/debug/*.apk

  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK (platform 34 + build-tools)
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d /tmp/cmdline
          sudo mv /tmp/cmdline/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Ключ подписи из секретов
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.p12" \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" > android/keystore.properties
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Ключ подписи получен из секретов"
          else
            echo "::warning::Секреты подписи не заданы — release будет неподписанным (только проверка сборки)"
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Версия
        id: ver
        run: |
          NAME="${{ github.event.inputs.versionName }}"
          CODE="${{ github.event.inputs.versionCode }}"
          if [ -z "$NAME" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$NAME" ]; then NAME="1.0.1"; fi
          if [ -z "$CODE" ]; then CODE="${{ github.run_number }}"; fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Собираем версию $NAME ($CODE)"

      - name: Собрать www/ и синхронизировать
        run: |
          bash scripts/build-www.sh
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Собрать release APK и AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -PmsVersionName="${{ steps.ver.outputs.name }}" \
            -PmsVersionCode="${{ steps.ver.outputs.code }}"

      - name: Проверить сборку
        run: |
          echo "=== APK ==="; find android/app/build/outputs -name "*.apk" -exec ls -lh {} \;
          echo "=== AAB ==="; find android/app/build/outputs -name "*.aab" -exec ls -lh {} \;
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs -name "*.aab" | head -1)
          test -n "$APK" && test -n "$AAB"
          aapt dump badging "$APK" | head -4
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            echo "--- подпись APK ---"; apksigner verify --print-certs "$APK" | head -5
            echo "--- подпись AAB ---"; jarsigner -verify -verbose:summary "$AAB" 2>&1 | tail -4
          fi

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: mini-studio-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Проверка самой цепочки подписи, когда настоящего ключа ещё нет:
      # генерируем ВРЕМЕННЫЙ ключ, подписываем им release-APK и проверяем apksigner.
      # Такой файл не публикуется (после установки его нельзя обновить другим ключом).
      - name: Проверка подписи на временном ключе
        if: steps.key.outputs.signed != 'true'
        run: |
          set -euo pipefail
          python3 scripts/make-signing-key.py --out "$RUNNER_TEMP/proofkeys" \
            --password 'proof-only-password' --alias ministudio \
            --dname 'CN=Mini Studio Proof, O=Mini Studio, C=CZ'
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          OUT="$RUNNER_TEMP/mini-studio-proof-signed.apk"
          apksigner sign --ks "$RUNNER_TEMP/proofkeys/release.p12" \
            --ks-pass pass:proof-only-password --ks-key-alias ministudio \
            --key-pass pass:proof-only-password --out "$OUT" "$APK"
          echo "--- проверка подписи ---"
          apksigner verify --verbose --print-certs "$OUT"
          cp "$OUT" android/app/build/outputs/proof-signed.apk
          echo "::notice title=Подпись проверена::Цепочка подписи работает (временный ключ). Добавьте свои секреты ANDROID_KEYSTORE_BASE64 и др., чтобы публиковать подписанные сборки."

      - name: Загрузить проверенный подписанный APK
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mini-studio-proof-signed-apk
          path: android/app/build/outputs/proof-signed.apk
          if-no-files-found: error

      - name: Инструкция, если ключа подписи нет
        if: steps.key.outputs.signed != 'true'
        run: |
          echo "::notice title=Ключ подписи не задан::Собрано без подписи. Чтобы получить подписанные APK и AAB: 1) bash scripts/gen-keystore.sh (или scripts/make-signing-key.py без JDK); 2) добавьте секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; 3) запустите этот workflow снова."

      - name: Опубликовать релиз (только подписанное)
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'release-latest' }}
          name: Mini Studio ${{ steps.ver.outputs.name }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Подписанный релиз Mini Studio ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }}).

            * `mini-studio-release-*.apk` — установить на телефон напрямую.
            * `mini-studio-release-*.aab` — загрузить в Google Play Console (Production → Create release).

            Инструкции и отпечатки ключа: `android/README-APK.md`.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
