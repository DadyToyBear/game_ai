name: Build APK

# Собирает debug-APK на каждом пуше в основную ветку разработки и по кнопке.
# Артефакт: mini-studio-debug.apk (ставится на телефон без подписи в магазине).

on:
  push:
    branches: ['arena/a11b2c5a-game-ai']
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vendor/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK (cmdline-tools + platform 34)
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /tmp
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d /tmp/cmdline
          sudo mv /tmp/cmdline/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Собрать www/ и синхронизировать Capacitor
        run: |
          bash scripts/build-www.sh
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Собрать debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/*/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-studio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Готовый APK всегда доступен по ссылке: Releases → apk-latest
      - name: Выложить APK в Release (apk-latest)
        if: github.ref == 'refs/heads/arena/a11b2c5a-game-ai'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mini Studio — свежий APK
          prerelease: true
          body: |
            Автоматическая сборка из ветки `arena/a11b2c5a-game-ai`.
            Скачайте `app-debug.apk` ниже и установите на Android (разрешите установку из неизвестных источников).
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Приложить APK к релизу (при теге)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
