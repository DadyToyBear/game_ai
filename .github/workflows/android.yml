name: Build APK

# Собирает debug-APK на каждом пуше в основную ветку разработки и по кнопке.
# Артефакт: mini-studio-debug.apk (ставится на телефон без подписи в магазине).

on:
  push:
    branches: ['arena/a11b2c5a-game-ai']
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vendor/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Собрать www/ и синхронизировать Capacitor
        run: |
          bash scripts/build-www.sh
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Собрать debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/*/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-studio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Приложить APK к релизу (при теге)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
