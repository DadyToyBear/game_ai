name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/f2de36b4-game-ai'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo "::error::Android SDK platform 35 is missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "::error::Android build-tools 35.0.0 are missing"; exit 1; }
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee /tmp/android-build.log || {
            tail -40 /tmp/android-build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-files-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
