name: Assemble Android editor and latest bridge

on:
  push:
    branches: [arena/b84b9c4f-game-ai]
    paths:
      - '.github/workflows/redot-android-bundle.yml'
      - 'redot-android/**'
      - 'redot-bridge/addons/redot_android_mcp/**'
      - 'redot-bridge/bridge.py'
      - 'redot-bridge/project_sync.py'
      - 'redot-bridge/relay.py'
      - 'redot-bridge/requirements-relay.txt'
      - 'redot-bridge/relay-deploy/**'
      - 'redot-bridge/web/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Find a successful, unexpired RC2 Android build
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected=80d31f765b0ead5551c277704e52bb51c515db1f
          mkdir -p source-apk artifact/addons
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --workflow redot-android-editor.yml --limit 100 --json databaseId,headSha,status,conclusion > runs.json
          found=false
          while IFS=$'\t' read -r id sha; do
            [ -n "$id" ] || continue
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/redot-android-editor.yml?ref=$sha" --jq .content | base64 -d | grep -q "ref: $expected"; then continue; fi
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "redot-26.3-rc2-android-arm64-and-usb-mcp" and .expired == false)] | length')
            if [ "$available" -ne 1 ]; then continue; fi
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name redot-26.3-rc2-android-arm64-and-usb-mcp --dir source-apk
            printf 'Engine revision: %s\nAPK build run: %s\nAPK build commit: %s\nBridge commit: %s\n' "$expected" "$id" "$sha" "$GITHUB_SHA" > artifact/BUILD-PROVENANCE.txt
            found=true
            break
          done < <(jq -r '.[] | select(.status == "completed" and .conclusion == "success") | [.databaseId, .headSha] | @tsv' runs.json)
          if [ "$found" != true ]; then echo '::error::No unexpired successful RC2 Android build found. Run the Android editor build workflow.' >&2; exit 1; fi
          mapfile -t apks < <(find source-apk -maxdepth 1 -type f -name 'android_editor-android-*.apk')
          if [ "${#apks[@]}" -eq 0 ]; then echo '::error::Source build contains no Android editor APK' >&2; exit 1; fi
          cp "${apks[@]}" artifact/
      - name: Add current bridge and addon
        run: |
          set -euo pipefail
          cp -a redot-bridge/addons/redot_android_mcp artifact/addons/
          cp redot-bridge/bridge.py redot-bridge/project_sync.py redot-bridge/relay.py redot-bridge/requirements-relay.txt artifact/
          cp -a redot-bridge/web artifact/web
          cp -a redot-bridge/relay-deploy artifact/relay-deploy
          cp redot-android/README.md artifact/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: redot-26.3-rc2-android-latest-bridge
          path: artifact/
          if-no-files-found: error
          retention-days: 14
