<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анимации воинов — 75 юнитов × 5 клипов</title>
  <style>
    :root {
      --bg: #14161b;
      --panel: rgba(26, 29, 36, .92);
      --border: rgba(255, 255, 255, .10);
      --accent: #d49b57;
      --text: #eef0f5;
      --muted: #98a0b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 0%, #242833 0%, #12141a 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline;
    }
    h1 { font-size: 19px; font-weight: 650; letter-spacing: .2px; }
    .sub { color: var(--muted); font-size: 13px; }
    .wrap { display: flex; gap: 18px; padding: 18px 24px 40px; align-items: flex-start; }
    aside {
      width: 264px; flex: 0 0 264px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; position: sticky; top: 18px;
      max-height: calc(100vh - 36px); overflow: auto;
    }
    .fac { margin-bottom: 12px; }
    .fac h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
      color: var(--muted); margin-bottom: 6px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .cls {
      display: block; width: 100%; text-align: left;
      background: transparent; border: 1px solid transparent;
      color: var(--text); font-size: 12.5px; padding: 5px 8px;
      border-radius: 7px; cursor: pointer; font-family: inherit;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cls:hover { background: rgba(255, 255, 255, .06); }
    .cls.on { background: rgba(212, 155, 87, .17); border-color: rgba(212, 155, 87, .45); }
    main { flex: 1; min-width: 0; }
    .bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 14px;
    }
    .bar select, .bar input {
      background: #1b1e25; color: var(--text); font-family: inherit; font-size: 13px;
      border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    }
    .chk { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .card h3 {
      font-size: 12.5px; font-weight: 600; padding: 8px 10px;
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .card h3 span { color: var(--muted); font-weight: 400; font-size: 11.5px; }
    .stage {
      position: relative; aspect-ratio: 4 / 5;
      background:
        linear-gradient(180deg, #e9ecef 0%, #d7dde3 100%);
      overflow: hidden;
    }
    .stage canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
    .ctrl {
      display: flex; gap: 6px; align-items: center; padding: 7px 9px;
      border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted);
    }
    .ctrl input[type=range] { flex: 1; accent-color: var(--accent); }
    .ctrl button {
      background: #232732; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px; cursor: pointer; font-family: inherit; font-size: 11.5px;
    }
    .ctrl button:hover { background: #2c3140; }
    .empty {
      padding: 40px; text-align: center; color: var(--muted); font-size: 14px;
      background: var(--panel); border: 1px dashed var(--border); border-radius: 12px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 999px;
      background: rgba(212, 155, 87, .16); color: #e7bd8b; font-size: 11px;
      border: 1px solid rgba(212, 155, 87, .3);
    }
    @media (max-width: 820px) {
      .wrap { flex-direction: column; padding: 14px; }
      aside { width: 100%; flex: 1 1 auto; position: static; max-height: none; }
    }
  </style>
</head>
<body>
<header>
  <h1>Спрайт-анимации воинов</h1>
  <span class="sub">75 юнитов · 5 клипов · 8 кадров · <span id="count">загрузка…</span></span>
</header>

<div class="wrap">
  <aside id="side"></aside>
  <main>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="allClips" checked /> все клипы</label>
      <label class="chk"><input type="checkbox" id="showShadow" checked /> тени</label>
      <label class="chk"><input type="checkbox" id="showBg" checked /> фон</label>
      <span class="badge" id="sel">выберите класс слева</span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
const FACTIONS = [
  { id: "01_celtic_briton",  ru: "Кельтские бритты", color: "#3F7A4A" },
  { id: "02_norse_viking",   ru: "Викинги",          color: "#2E5FA3" },
  { id: "03_gaulish_warrior",ru: "Галлы",            color: "#C08B2E" },
  { id: "04_slavic",         ru: "Славяне",          color: "#9B3F5C" },
  { id: "05_roman",          ru: "Римляне",          color: "#8B2B2B" },
];
const CLASSES = [
  ["01_archer", "Лучник"],
  ["02_two_handed_axeman", "Топор двуручный"],
  ["03_sword_and_shield", "Меч и щит"],
  ["04_two_handed_swordsman", "Меч двуручный"],
  ["05_mace_and_shield", "Булава и щит"],
  ["06_spearman_shield", "Копьё и щит"],
  ["07_stone_slinger", "Пращник"],
  ["08_cavalryman", "Кавалерист"],
  ["09_lord", "Лорд"],
  ["10_king", "Король"],
  ["11_prince", "Принц"],
  ["12_noble_commander", "Знатный военачальник"],
  ["13_centurion", "Центурион"],
  ["14_prefect", "Префект"],
  ["15_chieftain", "Вождь"],
];
const CLIPS = [
  ["walk", "Ходьба"], ["combat", "Бой"], ["craft", "Ремесло"],
  ["build", "Стройка"], ["quest", "Поход"],
];

const state = {
  faction: FACTIONS[0].id,
  cls: CLASSES[0][0],
  allClips: true,
  shadow: true,
  bg: true,
};

let renderers = [];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildSide() {
  const side = document.getElementById("side");
  side.innerHTML = FACTIONS.map(f => `
    <div class="fac">
      <h2><span class="dot" style="background:${f.color}"></span>${esc(f.ru)}</h2>
      ${CLASSES.map(([c, ru]) => `
        <button class="cls ${f.id === state.faction && c === state.cls ? "on" : ""}"
                data-f="${f.id}" data-c="${c}">${esc(ru)}</button>`).join("")}
    </div>`).join("");
  side.querySelectorAll(".cls").forEach(b => b.addEventListener("click", () => {
    state.faction = b.dataset.f; state.cls = b.dataset.c;
    side.querySelectorAll(".cls").forEach(x => x.classList.toggle("on", x === b));
    buildGrid();
  }));
}

// --- sprite strip playback -------------------------------------------------
class SpritePlayer {
  constructor(stage, meta, img, opts) {
    this.stage = stage; this.meta = meta; this.img = img; this.opts = opts;
    this.frame = 0; this.acc = 0; this.last = performance.now(); this.playing = true;
    this.canvas = document.createElement("canvas");
    stage.appendChild(this.canvas);
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    this.ro = new ResizeObserver(() => this.resize());
    this.ro.observe(stage);
    renderers.push(this);
  }
  resize() {
    const r = this.stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.max(1, Math.round(r.width * dpr));
    this.canvas.height = Math.max(1, Math.round(r.height * dpr));
    this.dpr = dpr;
    this.draw();
  }
  draw() {
    const { ctx, canvas, meta, img } = this;
    const fw = meta.frame_w, fh = meta.frame_h;
    const cw = canvas.width, ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);
    // scale so the character fills ~86% of the stage height
    const s = (ch * 0.86) / fh;
    const dw = fw * s, dh = fh * s;
    const dx = (cw - dw) / 2;
    const dy = ch - dh - ch * 0.055;
    if (this.opts.shadow) {
      const axp = dx + meta.anchor_x * s;
      const ayp = dy + meta.anchor_y * s;
      const rx = dw * 0.30;
      const g = ctx.createRadialGradient(axp, ayp, 1, axp, ayp, rx);
      g.addColorStop(0, "rgba(30,26,22,.30)");
      g.addColorStop(1, "rgba(30,26,22,0)");
      ctx.save();
      ctx.translate(axp, ayp); ctx.scale(1, 0.20); ctx.translate(-axp, -ayp);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(axp, ayp, rx, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.drawImage(img, this.frame * fw, 0, fw, fh, dx, dy, dw, dh);
  }
  step(now) {
    const dt = (now - this.last) / 1000;
    this.last = now;
    if (this.playing) {
      this.acc += dt;
      const spf = 1 / (this.meta.fps * this.speed || this.meta.fps);
      while (this.acc >= spf) { this.acc -= spf; this.frame = (this.frame + 1) % this.meta.frames; }
    }
    this.draw();
  }
  setSpeed(v) { this.speed = v; }
}

function loop(now) {
  for (const r of renderers) r.step(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

async function loadJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}
function loadImage(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = () => rej(new Error(url));
    i.src = url;
  });
}

async function buildGrid() {
  renderers = [];
  const grid = document.getElementById("grid");
  const base = `/assets/animations/${state.faction}/${state.cls}`;
  document.getElementById("sel").textContent =
    FACTIONS.find(f => f.id === state.faction).ru + " · " +
    CLASSES.find(c => c[0] === state.cls)[1];
  grid.innerHTML = `<div class="empty">Загрузка кадров…</div>`;

  const clips = state.allClips ? CLIPS : [CLIPS[0]];
  const cards = [];
  for (const [clip, ru] of clips) {
    try {
      const meta = await loadJSON(`${base}/${clip}.json`);
      const img = await loadImage(`${base}/${clip}.png`);
      cards.push({ clip, ru, meta, img });
    } catch (e) {
      cards.push({ clip, ru, missing: true });
    }
  }

  grid.innerHTML = "";
  for (const c of cards) {
    const card = document.createElement("div");
    card.className = "card";
    if (c.missing) {
      card.innerHTML = `<h3>${esc(c.ru)} <span>${esc(c.clip)}</span></h3>
        <div class="empty">Нет данных: анимация ещё не собрана</div>`;
      grid.appendChild(card);
      continue;
    }
    card.innerHTML = `
      <h3>${esc(c.ru)} <span>${c.meta.frames} кадров · ${c.meta.fps} fps</span></h3>
      <div class="stage" ${state.bg ? "" : 'style="background:#1a1d24"'}></div>
      <div class="ctrl">
        <button class="pp">⏸</button>
        <input type="range" min="0" max="${c.meta.frames - 1}" value="0" step="1" />
        <span class="fn">1/${c.meta.frames}</span>
      </div>`;
    grid.appendChild(card);
    const stage = card.querySelector(".stage");
    const p = new SpritePlayer(stage, c.meta, c.img, { shadow: state.shadow });
    p.speed = 1;
    const range = card.querySelector("input[type=range]");
    const fn = card.querySelector(".fn");
    const pp = card.querySelector(".pp");
    range.addEventListener("input", () => {
      p.playing = false; p.frame = Number(range.value); p.draw();
      fn.textContent = (p.frame + 1) + "/" + c.meta.frames;
      pp.textContent = "▶";
    });
    pp.addEventListener("click", () => {
      p.playing = !p.playing; pp.textContent = p.playing ? "⏸" : "▶";
    });
    const orig = p.step.bind(p);
    p.step = (now) => {
      orig(now);
      if (p.playing) { range.value = p.frame; fn.textContent = (p.frame + 1) + "/" + c.meta.frames; }
    };
  }
}

document.getElementById("allClips").addEventListener("change", e => {
  state.allClips = e.target.checked; buildGrid();
});
document.getElementById("showShadow").addEventListener("change", e => {
  state.shadow = e.target.checked; buildGrid();
});
document.getElementById("showBg").addEventListener("change", e => {
  state.bg = e.target.checked;
  document.querySelectorAll(".stage").forEach(s => {
    s.style.background = state.bg ? "" : "#1a1d24";
  });
});

buildSide();
buildGrid().then(() => {
  document.getElementById("count").textContent = "готово";
});
</script>
</body>
</html>
