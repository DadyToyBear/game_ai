# EXAMPLE ONLY. Use a dedicated hostname and valid publicly trusted certificate.
# Include limit zones in nginx's http {} context. Replace the hostname and paths.
limit_req_zone $binary_remote_addr zone=redot_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=redot_conn:10m;

server {
    listen 443 ssl;
    server_name replace-with-your-dedicated-domain.example;
    ssl_certificate /etc/letsencrypt/live/replace-with-your-dedicated-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replace-with-your-dedicated-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req zone=redot_req burst=20 nodelay;
    limit_conn redot_conn 20;
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_request_buffering on;
    }
}
